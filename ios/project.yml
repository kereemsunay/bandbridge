name: PBS163
options:
  bundleIdPrefix: com.kereem
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  PBS163:
    type: application
    platform: iOS
    sources:
      - PBS163
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kereem.pbs163
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: PBS163/Info.plist
      properties:
        CFBundleDisplayName: PBS163
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: "PBS163 bilekliğe bağlanmak için Bluetooth kullanılır."
        NSBluetoothPeripheralUsageDescription: "PBS163 bilekliğe bağlanmak için Bluetooth kullanılır."
        NSHealthShareUsageDescription: "Adım, nabız ve uyku verilerini Sağlık uygulamasına aktarmak için okuma izni."
        NSHealthUpdateUsageDescription: "Bileklikten gelen adım, nabız, uyku, kalori ve mesafe verilerini Sağlık'a yazmak için."
        UIBackgroundModes:
          - bluetooth-central
    entitlements:
      path: PBS163/PBS163.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
